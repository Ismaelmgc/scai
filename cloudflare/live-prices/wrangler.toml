name = "scai-live-prices"
main = "src/worker.js"
compatibility_date = "2024-09-01"

# Public, non-secret config. The two keys are set as encrypted secrets instead:
#   wrangler secret put SUPABASE_SERVICE_KEY
#   wrangler secret put FINNHUB_TOKEN
[vars]
SUPABASE_URL = "https://cdkxfjvbgrdzjmhxkytm.supabase.co"

# Every minute during ~US market hours (UTC). The worker also gates precisely by
# Eastern Time, so the wider UTC window (covers both EST and EDT) just over-
# schedules harmlessly and exits early off-hours. Weekdays only.
[triggers]
crons = ["* 13-21 * * 1-5"]
