name = "scai-scheduler"
main = "src/worker.js"
compatibility_date = "2024-09-01"

# Public, non-secret config. The GitHub token is an encrypted secret instead:
#   wrangler secret put GITHUB_TOKEN
# (fine-grained PAT on this repo with Repository permission "Actions: Read and write")
[vars]
GITHUB_REPO = "Ismaelmgc/scai"
GITHUB_REF = "main"

# Cloudflare cron is reliable (GitHub's scheduled cron is best-effort and runs
# late / gets dropped). Times are UTC, weekdays only. The worker routes each
# matched expression to a workflow and — for the morning one — gates precisely by
# New York time so it fires exactly at 09:32 ET (open+2min) across EDT and EST.
[triggers]
crons = [
  "0 3 * * 1-5",      # 03:00 UTC        -> liquidcap.yml (S&P 500 daily)
  "5 11 * * 1-5",     # 11:05 UTC        -> daily.yml     (small-cap daily)
  "32 13,14 * * 1-5", # 13:32 & 14:32 UTC -> morning.yml   (fill at 09:32 ET)
]
