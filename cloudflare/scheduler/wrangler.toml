name = "scai-scheduler"
main = "src/worker.js"
compatibility_date = "2024-09-01"

# Public, non-secret config. The GitHub token is an encrypted secret instead:
#   wrangler secret put GITHUB_TOKEN
# (fine-grained PAT on this repo with Repository permission "Actions: Read and write")
[vars]
GITHUB_REPO = "Ismaelmgc/scai"
GITHUB_REF = "main"

# Cloudflare cron is reliable (GitHub's scheduled cron is best-effort and runs
# late / gets dropped). Times are UTC; the worker routes each matched
# expression to its workflow (see src/worker.js).
[triggers]
crons = [
  "0 6 * * *",        # 06:00 UTC daily  -> daily.yml     (small-cap; every day = Fri-fail self-heal)
  "0 3 * * 1-5",      # 03:00 UTC L-V    -> liquidcap.yml (S&P 500 daily)
  "0 4 * * *",        # 04:00 UTC daily  -> bounce.yml    (dip-reversion; every day = Fri-fail self-heal)
  "10 0 * * *",       # 00:10 UTC daily  -> btc.yml       (BTC trend; candle closes 00:00 UTC)
]
