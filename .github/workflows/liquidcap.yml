name: SCAI liquidcap daily

# S&P 500 paper book "liquidcap" (spec GI_fs15_fund_20d): LightGBM LambdaRank on
# 15 price/volume + 10 point-in-time SEC fundamentals, top-8, 20-day hold.
#   - ingests the prior session's close (yfinance, dividend-adjusted) overnight
#   - updates exits, then enters today's top-8 at that CLOSE (market-on-close
#     simulation) in the same run — no separate open-fill job
#   - writes state + dashboard_view + NAV to Supabase (strategy "liquidcap")
#   - retrains weekly (purged by construction) and commits only the FOUNDATIONAL
#     data back (delisted slice, EDGAR facts, model, meta); current bars /
#     fundamentals / features are rebuilt each run
# Idempotent: a session is processed once (last_update guard); re-runs only
# refresh the view/NAV. NOTE: a session missed by an outage is NOT replayed
# automatically — exits for skipped days need a manual replay.

on:
  # PRIMARY trigger: the Cloudflare Worker (cloudflare/scheduler) dispatches at
  # 03:00 UTC on weekdays. BACKUP + weekend: this GitHub-native schedule runs
  # EVERY day so (a) a dropped Worker fire self-heals the next run and (b) Friday's
  # session is processed on Saturday — matching the small-cap daily (0 6 * * *) —
  # instead of being left until Monday. GitHub's cron is late/best-effort, but
  # liquidcap fills at the official close, so a late run gives the same result,
  # and historically the native schedule fired every weekday without a miss. The
  # `concurrency` group below + the last_update idempotency guard in
  # daily_liquidcap.py make an overlapping worker+native double-fire safe: the
  # second run finds the session already processed and only refreshes view/NAV.
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch: {}

permissions:
  contents: write # commit updated foundational data back

concurrency:
  group: scai-liquidcap
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: pip install -e .

      # The weekly retrain builds the full-panel feature matrix (~1.5M rows x
      # ~470 cols), whose transient peak RSS is ~13GB — above the hosted runner's
      # RAM. Without headroom the kernel OOM-kills the job and Actions reports it
      # as "The operation was canceled" (no traceback). Replace the default 4GB
      # swap with 16GB so the peak spills to disk instead of dying. Only the
      # weekly retrain hits this; daily scoring stays small.
      - name: Enlarge swap (retrain peak > runner RAM)
        run: |
          sudo swapoff -a || true
          sudo rm -f /mnt/swapfile
          sudo fallocate -l 16G /mnt/swapfile
          sudo chmod 600 /mnt/swapfile
          sudo mkswap /mnt/swapfile
          sudo swapon /mnt/swapfile
          free -h

      - name: Liquidcap daily
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          # Run summary + failure alerts to Telegram (optional — no-op if unset).
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # sec_edgar.py falls back to a built-in User-Agent if unset
          PYTHONPATH: src
          PYTHONIOENCODING: utf-8
        run: python scripts/liquidcap/daily_liquidcap.py

      - name: Commit foundational data & model
        run: |
          git config user.name "scai-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A data/liquidcap/
          if git diff --cached --quiet; then
            echo "No liquidcap data changes to commit."
          else
            git commit -m "liquidcap: update model & EDGAR facts [skip ci]"
            # main may have advanced during this run; rebase our data-only commit
            # onto it and retry so the push never fails on a non-fast-forward.
            ok=0
            for i in 1 2 3 4 5; do
              if git push; then ok=1; break; fi
              echo "push rejected — rebasing onto origin/main (attempt $i)"
              git pull --rebase origin main
              sleep 3
            done
            [ "$ok" = 1 ] || { echo "push failed after retries"; exit 1; }
          fi
