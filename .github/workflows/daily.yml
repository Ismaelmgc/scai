name: SCAI daily

# Runs the production daily pipeline on GitHub's servers (no PC required),
# commits the updated paper-trading state back to the repo, and publishes a
# static snapshot of the dashboard to GitHub Pages.
#
# Timing: GitHub cron is UTC. Runs in the MADRUGADA (06:00 UTC ≈ 02:00 ET) and
# targets the PREVIOUS session's close (today's bar doesn't exist until after the
# 20:00 UTC close, and free Polygon only publishes a session's grouped bar hours
# later — next morning UTC). So the madrugada run ingests yesterday's just-published
# close, generates signals, and morning.yml fills at today's open (close → next
# open, like the backtest).
# Why NOT evening (the old 23:00 UTC): free hadn't published the same-day bar yet
# at 23:00-00:00 UTC → 403, and the run committed stale data in GREEN (2026-06-29).
# Why NOT mid/late morning: GitHub delays scheduled runs ~3h (up to 5h); a 10-11:00
# UTC cron then lands too close to / past the 13:30 UTC open. 06:00 UTC + 5h delay +
# ~1h runtime finishes by ~12:00 UTC — a margin before the open even in the worst
# case — while still being late enough that free has published the prior session.
# Silent failures are now caught: download_ohlcv_grouped raises on a PAST-session
# error (red run), and daily_pipeline sends a Telegram summary every run.
# Runs EVERY day: on a weekend it skips if data is current, but a failed Friday run
# SELF-HEALS on Sat/Sun (catches up instead of waiting until Monday). Idempotent.
# Use "Run workflow" (workflow_dispatch) to run on demand.

on:
  schedule:
    - cron: "0 6 * * *" # daily 06:00 UTC (madrugada, ~02:00 ET); late enough for free's overnight publish, early enough to clear the open even with GitHub's delay
  workflow_dispatch: {}

permissions:
  contents: write # commit updated data/ back to the repo
  pages: write # publish the static dashboard
  id-token: write # required by actions/deploy-pages

concurrency:
  group: scai-daily
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: pip install -e .

      - name: Daily pipeline
        env:
          SCAI_POLYGON_API_KEY: ${{ secrets.SCAI_POLYGON_API_KEY }}
          SCAI_SEED: "42"
          SCAI_ENV: production
          MASSIVE_CALLS_PER_MINUTE: "5"  # free tier since 2026-06-19 (5/min; ~1h for 320 tickers, recent bars OK, >2y history 403s but that's already in the parquet)
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          # Run summary + failure alerts to Telegram (optional — no-op if unset).
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PYTHONPATH: src
          PYTHONIOENCODING: utf-8
        run: python scripts/daily_pipeline.py

      - name: Illiquid shadow logger (OOS test — non-blocking)
        # Logs the illiquid-variant top-8 (low-ADV tercile + widest-20%-spread
        # trim) and scores matured 20d cohorts vs IWM. Isolated: own parquet log,
        # no Supabase/paper book. continue-on-error → can never fail the job.
        continue-on-error: true
        env:
          PYTHONPATH: src
          PYTHONIOENCODING: utf-8
        run: python scripts/illiquid_shadow.py

      - name: Render static dashboard
        env:
          PYTHONPATH: src
          # Anon (publishable) key + URL embedded in the login shell so it can
          # authenticate and read Supabase. RLS restricts reads to logged-in users.
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: python scripts/render_static_dashboard.py

      - name: Commit updated market data & model
        # Paper-trading state lives in Supabase (gitignored). This only persists
        # the OHLCV/SPY/EDGAR caches and the retrained model across runs.
        run: |
          git config user.name "scai-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A data/
          if git diff --cached --quiet; then
            echo "No data changes to commit."
          else
            git commit -m "daily: update market data & model [skip ci]"
            git push
          fi

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to Pages
        id: deploy
        uses: actions/deploy-pages@v4
