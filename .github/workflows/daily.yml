name: SCAI daily

# Runs the production daily pipeline on GitHub's servers (no PC required),
# commits the updated paper-trading state back to the repo, and publishes a
# static snapshot of the dashboard to GitHub Pages.
#
# Timing: GitHub cron is UTC. Runs in the MORNING (11:05 UTC ≈ 06:05 EST /
# 07:05 EDT) — NOT the prior evening — because on the free Polygon tier a
# session's EOD bar is only published the next day (T+1); a same-evening run gets
# a 403 for the in-progress day. By morning, yesterday's close is available, so
# the pipeline ingests it, generates signals, and morning.yml (09:45 ET) fills at
# today's open — same economics as the old paid same-day evening run, no lag.
# 11:05 UTC is safely after the overnight publish and before the open year-round.
# The pipeline is idempotent (skips if it already ran for the session), so a
# delayed or duplicate trigger is harmless. Use the "Run workflow" button
# (workflow_dispatch) to trigger a run on demand.

on:
  schedule:
    - cron: "5 11 * * 1-5" # weekday mornings, 11:05 UTC (after free's T+1 EOD publish, before open)
  workflow_dispatch: {}

permissions:
  contents: write # commit updated data/ back to the repo
  pages: write # publish the static dashboard
  id-token: write # required by actions/deploy-pages

concurrency:
  group: scai-daily
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: pip install -e .

      - name: Daily pipeline
        env:
          SCAI_POLYGON_API_KEY: ${{ secrets.SCAI_POLYGON_API_KEY }}
          SCAI_SEED: "42"
          SCAI_ENV: production
          MASSIVE_CALLS_PER_MINUTE: "5"  # free tier since 2026-06-19 (5/min; ~1h for 320 tickers, recent bars OK, >2y history 403s but that's already in the parquet)
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          PYTHONPATH: src
          PYTHONIOENCODING: utf-8
        run: python scripts/daily_pipeline.py

      - name: Render static dashboard
        env:
          PYTHONPATH: src
          # Anon (publishable) key + URL embedded in the login shell so it can
          # authenticate and read Supabase. RLS restricts reads to logged-in users.
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: python scripts/render_static_dashboard.py

      - name: Commit updated market data & model
        # Paper-trading state lives in Supabase (gitignored). This only persists
        # the OHLCV/SPY/EDGAR caches and the retrained model across runs.
        run: |
          git config user.name "scai-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A data/
          if git diff --cached --quiet; then
            echo "No data changes to commit."
          else
            git commit -m "daily: update market data & model [skip ci]"
            git push
          fi

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to Pages
        id: deploy
        uses: actions/deploy-pages@v4
