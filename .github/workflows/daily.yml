name: SCAI daily

# Runs the production daily pipeline on GitHub's servers (no PC required),
# commits the updated paper-trading state back to the repo, and publishes a
# static snapshot of the dashboard to GitHub Pages.
#
# Timing: GitHub cron is UTC. Runs in the OVERNIGHT window (04:00 UTC ≈ 00:00 ET).
# The pipeline targets predict_to = yesterday (D-1) and never needs the current
# day's bar, so it only needs the PREVIOUS session's EOD bar. That bar is NOT a
# T+1-delayed thing (earlier belief was wrong): Polygon's only gate is "today's
# data before end of day" (the in-progress day's grouped bar simply doesn't exist
# until after the 20:00 UTC close). D-1's bar is fully consolidated within a few
# hours of its close — verified available overnight (12.3k tickers). So running at
# 04:00 UTC ingests D-1's close, generates signals, and morning.yml fills at
# today's open — same economics, no lag.
# Why overnight, not 11:05: GitHub delays scheduled runs ~3h (up to 5h). At 11:05
# that pushed the actual run PAST the 13:30 UTC open. At 04:00, even a 5h delay +
# ~1h runtime finishes by ~10:00 UTC — a 3.5h cushion before the open. Floor is
# ~02:00 UTC (margin after D-1 close + Polygon consolidation); ceiling ~08:00 UTC
# (must clear the open with the delay). The pipeline is idempotent (skips if it
# already ran for the session), so a delayed or duplicate trigger is harmless.
# Use the "Run workflow" button (workflow_dispatch) to trigger a run on demand.

on:
  schedule:
    - cron: "0 4 * * 1-5" # weekday overnight, 04:00 UTC (after D-1 EOD publish, well before the open even with GitHub's delay)
  workflow_dispatch: {}

permissions:
  contents: write # commit updated data/ back to the repo
  pages: write # publish the static dashboard
  id-token: write # required by actions/deploy-pages

concurrency:
  group: scai-daily
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: pip install -e .

      - name: Daily pipeline
        env:
          SCAI_POLYGON_API_KEY: ${{ secrets.SCAI_POLYGON_API_KEY }}
          SCAI_SEED: "42"
          SCAI_ENV: production
          MASSIVE_CALLS_PER_MINUTE: "5"  # free tier since 2026-06-19 (5/min; ~1h for 320 tickers, recent bars OK, >2y history 403s but that's already in the parquet)
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          PYTHONPATH: src
          PYTHONIOENCODING: utf-8
        run: python scripts/daily_pipeline.py

      - name: Render static dashboard
        env:
          PYTHONPATH: src
          # Anon (publishable) key + URL embedded in the login shell so it can
          # authenticate and read Supabase. RLS restricts reads to logged-in users.
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: python scripts/render_static_dashboard.py

      - name: Commit updated market data & model
        # Paper-trading state lives in Supabase (gitignored). This only persists
        # the OHLCV/SPY/EDGAR caches and the retrained model across runs.
        run: |
          git config user.name "scai-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A data/
          if git diff --cached --quiet; then
            echo "No data changes to commit."
          else
            git commit -m "daily: update market data & model [skip ci]"
            git push
          fi

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to Pages
        id: deploy
        uses: actions/deploy-pages@v4
