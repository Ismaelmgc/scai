name: SCAI daily

# Runs the production daily pipeline on GitHub's servers (no PC required),
# commits the updated paper-trading state back to the repo, and publishes a
# static snapshot of the dashboard to GitHub Pages.
#
# Timing: GitHub cron is UTC. Runs in the EVENING after the US close (23:00 UTC ≈
# 19:00 ET summer / 18:00 ET winter — 2-3h past the 16:00 ET close). By then the
# day's session is settled and its grouped bar is published, so the pipeline
# ingests the SAME day's close, generates signals, and morning.yml fills at the
# NEXT open (close → next open, exactly like the backtest).
# Why evening, not morning: a morning/overnight run can only ever see the PREVIOUS
# session (today's bar doesn't exist until after the 20:00 UTC close), which left
# the dashboard a session stale and added a day of lag between signal and fill.
# Why not pegged to the close (the old 21:05 UTC, which 403'd ~5 min after the
# winter close): 23:00 UTC keeps a 2-3h margin year-round so the bar is fully
# consolidated, and a stray "before end of day" 403 is caught + skipped by
# download_ohlcv_grouped (never a crash, never a partial bar). GitHub may delay the
# run ~3h (up to 5h) → it still finishes by ~03:00-05:00 UTC, many hours before the
# 13:30 UTC open. Runs EVERY day (not just weekdays): on a weekend the pipeline
# skips immediately if data is current, but a failed Friday run SELF-HEALS on
# Sat/Sun (it catches up instead of waiting until Monday). The pipeline is
# idempotent. Use "Run workflow" (workflow_dispatch) to run on demand.

on:
  schedule:
    - cron: "0 23 * * *" # daily 23:00 UTC (evening, ~2-3h after the US close); weekend runs self-skip unless data is behind
  workflow_dispatch: {}

permissions:
  contents: write # commit updated data/ back to the repo
  pages: write # publish the static dashboard
  id-token: write # required by actions/deploy-pages

concurrency:
  group: scai-daily
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: pip install -e .

      - name: Daily pipeline
        env:
          SCAI_POLYGON_API_KEY: ${{ secrets.SCAI_POLYGON_API_KEY }}
          SCAI_SEED: "42"
          SCAI_ENV: production
          MASSIVE_CALLS_PER_MINUTE: "5"  # free tier since 2026-06-19 (5/min; ~1h for 320 tickers, recent bars OK, >2y history 403s but that's already in the parquet)
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          PYTHONPATH: src
          PYTHONIOENCODING: utf-8
        run: python scripts/daily_pipeline.py

      - name: Render static dashboard
        env:
          PYTHONPATH: src
          # Anon (publishable) key + URL embedded in the login shell so it can
          # authenticate and read Supabase. RLS restricts reads to logged-in users.
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: python scripts/render_static_dashboard.py

      - name: Commit updated market data & model
        # Paper-trading state lives in Supabase (gitignored). This only persists
        # the OHLCV/SPY/EDGAR caches and the retrained model across runs.
        run: |
          git config user.name "scai-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A data/
          if git diff --cached --quiet; then
            echo "No data changes to commit."
          else
            git commit -m "daily: update market data & model [skip ci]"
            git push
          fi

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to Pages
        id: deploy
        uses: actions/deploy-pages@v4
