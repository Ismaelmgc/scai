name: Universe refresh

# Monthly: add new small-cap entrants and refresh active/delisted flags so the
# tradable universe doesn't erode. 06:00 UTC on the 1st of each month. The 30-day
# caches (ticker catalog / rejected) expire naturally at this cadence.
# Manual runs via workflow_dispatch.
on:
  schedule:
    - cron: "0 6 1 * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install
        run: pip install -e .

      - name: Refresh universe
        env:
          SCAI_POLYGON_API_KEY: ${{ secrets.SCAI_POLYGON_API_KEY }}
          MASSIVE_CALLS_PER_MINUTE: "50"  # paid Polygon until 2026-06-19; set to 5 after (free tier)
          PYTHONPATH: src
          PYTHONIOENCODING: utf-8
        run: python scripts/refresh_universe.py

      - name: Commit updated universe
        run: |
          git config user.name "scai-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A data/processed/
          if git diff --cached --quiet; then
            echo "No universe changes to commit."
          else
            git commit -m "universe: monthly refresh [skip ci]"
            # main may have advanced during this run; rebase our data-only commit
            # onto it and retry so the push never fails on a non-fast-forward.
            ok=0
            for i in 1 2 3 4 5; do
              if git push; then ok=1; break; fi
              echo "push rejected — rebasing onto origin/main (attempt $i)"
              git pull --rebase origin main
              sleep 3
            done
            [ "$ok" = 1 ] || { echo "push failed after retries"; exit 1; }
          fi
