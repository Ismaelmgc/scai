[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "scai"
version = "0.2.0"
description = "Algorithmic trading research platform: ML stock ranking (S&P 500), rule-based BTC trend, paper trading"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "SCAI Team" }]

dependencies = [
    # Core
    "pydantic>=2.5,<3",
    "pydantic-settings>=2.1,<3",
    "python-dotenv>=1.0",
    # Data
    "pandas>=2.1,<3",
    "numpy>=1.26,<2",
    "pyarrow>=14,<26",  # 26.0 (2026-10-09) requires NumPy 2 at runtime but we pin numpy<2
    "duckdb>=0.9",
    "httpx>=0.25",
    "requests>=2.31",  # Tiingo + Wikipedia fetch (liquidcap universe)
    "yfinance>=0.2.40",  # liquidcap PRIMARY price source (dividend-adjusted)
    "lxml>=5.0",  # pandas.read_html for the S&P 500 membership table
    # ML / stats
    "lightgbm>=4.1,<5",  # <5: the committed models are pickled lightgbm Boosters
    "scipy>=1.11",  # live-IC monitor, leak verifier, evaluation harness
    # Web (local dashboard + static Pages renderer)
    "fastapi>=0.104",
    "uvicorn[standard]>=0.24",
    "jinja2>=3.1",
    # Logging
    "structlog>=23.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "ruff>=0.1",
    "mypy>=1.7",
]

[project.scripts]
scai = "app.cli.main:app"

[tool.hatch.build.targets.wheel]
packages = ["src/app"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "TCH"]
# N803/N806: ML code uses uppercase X (feature matrix) as an argument/variable.
ignore = ["B008", "B023", "N803", "N806", "TC001", "TC002", "TC003"]

[tool.ruff.lint.per-file-ignores]
# `col == True/False` on an object column treats None/NaN as False on purpose;
# the "truthy" rewrite ruff suggests would raise on those rows.
"src/app/data/smallcap_universe.py" = ["E712"]
"src/app/smallcap/data.py" = ["E712"]

[tool.mypy]
python_version = "3.11"
strict = true
disallow_any_generics = false
warn_return_any = true
warn_unused_configs = true
plugins = ["pydantic.mypy"]
disable_error_code = ["import-untyped"]

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
]
